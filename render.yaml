# Render Blueprint: the API. The frontend goes on Vercel (see DEPLOY.md).
services:
  - type: web
    name: gatorbite-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_VERTEX
        value: "true"
      # secrets: you paste these in the Render dashboard, they are never stored in git
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
